[project]
name = "mcp-weather-israel"
version = "0.1.0"
description = "MCP Server that controls a browser with Playwright to fetch Israeli weather forecasts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "httpx>=0.27",
    "playwright>=1.45",
    "openai>=1.40",
    "python-dotenv>=1.0",
]
